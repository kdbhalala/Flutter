id = "flutter"
name = "Flutter"
description = "Full Flutter and Dart support for Zed: LSP (dart analysis server), syntax highlighting, code outline, snippets, tasks, slash commands, hot-reload debugging (Flutter DAP), and Dart CLI debugging."
version = "0.1.0"
schema_version = 1
authors = ["Krunal Bhalala <kdbhalala@gmail.com>"]
repository = "https://github.com/kdbhalala/Flutter"

[language_servers.dart]
name = "Dart LSP"
languages = ["Dart"]

[grammars.dart]
repository = "https://github.com/UserNobody14/tree-sitter-dart"
rev = "80e23c07b64494f7e21090bb3450223ef0b192f4"

[slash_commands.flutter]
description = "Run Flutter CLI commands"
requires_argument = true

[slash_commands.fvm]
description = "Run FVM-managed Flutter CLI commands"
requires_argument = true

[slash_commands.dart]
description = "Run Dart CLI commands (analyze, test, format, pub, etc.)"
requires_argument = true

[debug_adapters.Dart]
schema_path = "debug_adapter_schemas/Dart.json"

[debug_locators.dart]
