id = "flutter"
name = "Flutter"
description = "Flutter and Dart support for Zed: LSP, tasks, hot reload, and debugging."
version = "0.1.0"
schema_version = 1
authors = ["Krunal Bhalala <kdbhalala@gmail.com>"]
repository = "https://github.com/krunalbhalala/zed-flutter"

[language_servers.dart]
name = "Dart LSP"
language = "Dart"
languages = ["Dart"]

[grammars.dart]
repository = "https://github.com/UserNobody14/tree-sitter-dart"
commit = "80e23c07b64494f7e21090bb3450223ef0b192f4"

[[slash_commands]]
name = "flutter"
description = "Run Flutter CLI commands"
tooltip_text = "Run Flutter command"
requires_argument = true

[[slash_commands]]
name = "fvm"
description = "Run FVM-managed Flutter CLI commands"
tooltip_text = "Run FVM Flutter command"
requires_argument = true

[[slash_commands]]
name = "dart"
description = "Run Dart CLI commands (analyze, test, format, pub, etc.)"
tooltip_text = "Run Dart command"
requires_argument = true

[debug_adapters.Dart]
